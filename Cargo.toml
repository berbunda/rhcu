[package]
name = "rhcu"
version = "0.3.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.6"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
digest = "0.11.3"
generic-array = "1.4.4"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha = "1.0.3"
sha2 = "0.11.0"
sha3 = "0.12.0"
